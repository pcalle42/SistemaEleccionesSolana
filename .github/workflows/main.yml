name: main-validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm ci:main

  devnet-clean-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prove clean-room bootstrap and idempotency
        run: |
          pnpm devnet:reset -- --force
          pnpm devnet:bootstrap
          pnpm devnet:bootstrap
      - run: pnpm devnet:e2e
      - run: pnpm devnet:verify
      - name: Collect sanitized diagnostics
        if: always()
        run: |
          mkdir -p test-results/devnet
          pnpm devnet:status >test-results/devnet/status.txt 2>&1 || true
          pnpm devnet:logs >test-results/devnet/services.log 2>&1 || true
      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: devnet-diagnostics-${{ github.sha }}
          path: test-results/devnet
          retention-days: 7
      - name: Stop isolated devnet
        if: always()
        run: pnpm devnet:down || true
