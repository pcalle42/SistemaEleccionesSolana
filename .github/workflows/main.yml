name: main-validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devnet-clean-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prove clean-room bootstrap and idempotency
        run: |
          pnpm devnet:reset -- --force
          pnpm devnet:bootstrap
          pnpm devnet:bootstrap
      - run: pnpm devnet:e2e
      - run: pnpm devnet:verify
      - name: Collect sanitized diagnostics
        if: always()
        run: |
          mkdir -p test-results/devnet
          pnpm devnet:status >test-results/devnet/status.txt 2>&1 || true
          pnpm devnet:logs >test-results/devnet/services.log 2>&1 || true
      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: devnet-diagnostics
          path: test-results/devnet
          retention-days: 7
      - name: Stop isolated devnet without deleting evidence early
        if: always()
        run: |
          pnpm devnet:down || true
          pnpm devnet:down || true

  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:main

  release-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: full-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:reproducibility
      - run: pnpm test:performance
