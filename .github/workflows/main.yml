name: main-validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm ci:main

  devnet-clean-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prove clean-room bootstrap and idempotency
        run: |
          pnpm devnet:reset -- --force
          pnpm devnet:bootstrap
          pnpm devnet:bootstrap
      - run: pnpm devnet:e2e
      - run: pnpm devnet:verify
      - name: Collect sanitized diagnostics
        if: always()
        run: |
          mkdir -p test-results/devnet
          pnpm devnet:status >test-results/devnet/status.txt 2>&1 || true
          pnpm devnet:logs >test-results/devnet/services.log 2>&1 || true
      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: ignore
          name: devnet-diagnostics-${{ github.sha }}
          path: test-results/devnet
          retention-days: 7
      - name: Stop isolated devnet
        if: always()
        run: pnpm devnet:down || true
