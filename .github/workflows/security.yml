name: security-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm test:security:policy
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

  container-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: admin-web
            dockerfile: apps/admin-web/Dockerfile
          - name: voter-web
            dockerfile: apps/voter-web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build hardened image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "votaciones-${{ matrix.name }}:security-${GITHUB_SHA}" .
      - name: Scan image; scanner failure is a gate failure
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: '1'
          format: table
          image-ref: votaciones-${{ matrix.name }}:security-${{ github.sha }}
          severity: HIGH,CRITICAL
          trivyignores: release/security/.trivyignore
          vuln-type: os,library
