name: security-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.23.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm test:security:policy
      - uses: gitleaks/gitleaks-action@v3.0.0

  container-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened frontend images
        run: |
          docker build --file apps/admin-web/Dockerfile --tag votaciones-admin:security .
          docker build --file apps/voter-web/Dockerfile --tag votaciones-voter:security .
      - name: Scan admin image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          exit-code: '1'
          format: table
          ignore-unfixed: true
          image-ref: votaciones-admin:security
          severity: CRITICAL
          vuln-type: os,library
      - name: Scan voter image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          exit-code: '1'
          format: table
          ignore-unfixed: true
          image-ref: votaciones-voter:security
          severity: CRITICAL
          vuln-type: os,library
