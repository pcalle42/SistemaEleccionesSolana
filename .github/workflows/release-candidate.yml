name: release-candidate

on:
  push:
    tags:
      - 'v*-rc.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer without the v prefix
        required: true
        type: string
      classification:
        description: Devnet proves the pipeline; production requires approved production-safe ZK artifacts
        options: [devnet, production]
        required: true
        type: choice

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      classification: ${{ steps.identity.outputs.classification }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        name: Resolve immutable source identity
        env:
          DISPATCH_CLASSIFICATION: ${{ inputs.classification }}
          DISPATCH_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == 'push' ]]; then
            version="${GITHUB_REF_NAME#v}"
            classification='production'
          else
            version="${DISPATCH_VERSION}"
            classification="${DISPATCH_CLASSIFICATION}"
          fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || {
            printf 'error: release candidate must use MAJOR.MINOR.PATCH-rc.N\n' >&2
            exit 1
          }
          printf 'version=%s\nclassification=%s\n' "${version}" "${classification}" >>"${GITHUB_OUTPUT}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Full release quality gate
        env:
          RELEASE_CLASSIFICATION: ${{ steps.identity.outputs.classification }}
        run: pnpm ci:release
      - run: pnpm audit --prod --audit-level high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

  devnet-clean-room:
    needs: release-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm devnet:reset -- --force
      - run: pnpm devnet:bootstrap
      - run: pnpm devnet:e2e
      - run: pnpm devnet:verify
      - if: always()
        run: pnpm devnet:down || true

  immutable-images-and-evidence:
    needs: [release-gates, devnet-clean-room]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GHCR with the job-scoped token
        run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and publish immutable RC image tags
        run: bash scripts/release/build-images.sh "${{ needs.release-gates.outputs.version }}" "${GITHUB_SHA}" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" artifacts/release "${{ needs.release-gates.outputs.classification }}"
      - id: images
        name: Resolve digest-pinned image references
        run: |
          printf 'api=%s\n' "$(node -p "require('./artifacts/release/images.json').api.reference")" >>"${GITHUB_OUTPUT}"
          printf 'admin=%s\n' "$(node -p "require('./artifacts/release/images.json').adminWeb.reference")" >>"${GITHUB_OUTPUT}"
          printf 'voter=%s\n' "$(node -p "require('./artifacts/release/images.json').voterWeb.reference")" >>"${GITHUB_OUTPUT}"
      - name: Verify image hardening and digest identity
        run: bash scripts/release/verify-images.sh "${{ steps.images.outputs.api }}" "${{ steps.images.outputs.admin }}" "${{ steps.images.outputs.voter }}" "${{ needs.release-gates.outputs.classification }}"
      - name: Rehearse the same immutable images with synthetic data
        if: needs.release-gates.outputs.classification == 'devnet'
        env:
          ADMIN_WEB_IMAGE: ${{ steps.images.outputs.admin }}
          APP_VERSION: ${{ needs.release-gates.outputs.version }}
          API_IMAGE: ${{ steps.images.outputs.api }}
          GIT_COMMIT: ${{ github.sha }}
          VOTER_WEB_IMAGE: ${{ steps.images.outputs.voter }}
        run: |
          pnpm devnet:reset -- --force
          pnpm devnet:bootstrap
          pnpm devnet:e2e
          pnpm devnet:verify
      - name: Stop immutable-image rehearsal
        if: always()
        run: pnpm devnet:down || true
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: '1'
          format: sarif
          image-ref: ${{ steps.images.outputs.api }}
          output: artifacts/release/trivy-api.sarif
          severity: HIGH,CRITICAL
          trivyignores: release/security/.trivyignore
      - name: Scan admin image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: '1'
          format: sarif
          image-ref: ${{ steps.images.outputs.admin }}
          output: artifacts/release/trivy-admin-web.sarif
          severity: HIGH,CRITICAL
          trivyignores: release/security/.trivyignore
      - name: Scan voter image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: '1'
          format: sarif
          image-ref: ${{ steps.images.outputs.voter }}
          output: artifacts/release/trivy-voter-web.sarif
          severity: HIGH,CRITICAL
          trivyignores: release/security/.trivyignore
      - name: Generate API SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          artifact-name: sbom-api.spdx.json
          format: spdx-json
          image: ${{ steps.images.outputs.api }}
          output-file: artifacts/release/sbom-api.spdx.json
          upload-artifact: false
      - name: Generate admin SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          artifact-name: sbom-admin-web.spdx.json
          format: spdx-json
          image: ${{ steps.images.outputs.admin }}
          output-file: artifacts/release/sbom-admin-web.spdx.json
          upload-artifact: false
      - name: Generate voter SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          artifact-name: sbom-voter-web.spdx.json
          format: spdx-json
          image: ${{ steps.images.outputs.voter }}
          output-file: artifacts/release/sbom-voter-web.spdx.json
          upload-artifact: false
      - name: Generate and verify ReleaseManifestV1
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/release/create-inputs.mjs --images artifacts/release/images.json --output artifacts/release/inputs.json --run-url "${RUN_URL}" --builder "github-actions/${GITHUB_RUN_ID}" --workflow-ref "${GITHUB_WORKFLOW_REF}"
          pnpm release:manifest -- --version "${{ needs.release-gates.outputs.version }}" --classification "${{ needs.release-gates.outputs.classification }}" --inputs artifacts/release/inputs.json --output artifacts/release/release-manifest.json --git-commit "${GITHUB_SHA}"
          pnpm release:verify -- --manifest artifacts/release/release-manifest.json --source-commit "${GITHUB_SHA}"
          pnpm release:provenance -- --manifest artifacts/release/release-manifest.json --output artifacts/release/provenance.intoto.jsonl
          node scripts/release/create-release-notes.mjs --version "${{ needs.release-gates.outputs.version }}" --output artifacts/release/RELEASE_NOTES.md
      - name: Publish immutable release evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: release-${{ needs.release-gates.outputs.version }}
          path: artifacts/release
          retention-days: 90
