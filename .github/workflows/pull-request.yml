name: pull-request

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pr
