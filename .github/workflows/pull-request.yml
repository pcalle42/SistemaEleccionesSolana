name: pull-request

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm ci:validate
      - name: Run expanded gates for critical or shared paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_REF}" --depth=1
          changed="$(git diff --name-only "origin/${BASE_REF}"...HEAD)"
          if printf '%s\n' "${changed}" | grep -Eq '^(apps/api/|packages/|infra/|tests/|pnpm-lock.yaml$|package.json$|\.github/|release/|scripts/)'; then
            pnpm ci:critical
          else
            printf 'No critical/shared paths changed; baseline quality gate is sufficient.\n'
          fi
