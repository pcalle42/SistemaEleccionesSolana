name: ${COMPOSE_PROJECT_NAME:-votaciones}

services:
  api:
    image: ${API_IMAGE:-${COMPOSE_PROJECT_NAME:-votaciones}-api}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      ADMIN_ARGON2_MEMORY_KIB: ${ADMIN_ARGON2_MEMORY_KIB:-19456}
      ADMIN_ARGON2_PARALLELISM: ${ADMIN_ARGON2_PARALLELISM:-1}
      ADMIN_ARGON2_TIME_COST: ${ADMIN_ARGON2_TIME_COST:-2}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_LOGIN_NETWORK_MAXIMUM: ${ADMIN_LOGIN_NETWORK_MAXIMUM:-20}
      ADMIN_LOGIN_USER_MAXIMUM: ${ADMIN_LOGIN_USER_MAXIMUM:-5}
      ADMIN_LOGIN_WINDOW_SECONDS: ${ADMIN_LOGIN_WINDOW_SECONDS:-300}
      ADMIN_SESSION_ABSOLUTE_SECONDS: ${ADMIN_SESSION_ABSOLUTE_SECONDS:-28800}
      ADMIN_SESSION_IDLE_SECONDS: ${ADMIN_SESSION_IDLE_SECONDS:-900}
      APP_SHUTDOWN_GRACE_MS: ${APP_SHUTDOWN_GRACE_MS:-30000}
      APP_HOST: 0.0.0.0
      APP_PORT: '3000'
      APP_VERSION: ${APP_VERSION:-0.1.0-dev}
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_TRANSPORT_POLICY: ${DATABASE_TRANSPORT_POLICY:-platform-private}
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-10000}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      DEVNET_ADMIN_PASSWORD: ${DEVNET_ADMIN_PASSWORD:-}
      DEVNET_ADMIN_USERNAME: ${DEVNET_ADMIN_USERNAME:-}
      DEVNET_GIT_COMMIT: ${DEVNET_GIT_COMMIT:-unknown}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      HTTP_BODY_LIMIT_BYTES: ${HTTP_BODY_LIMIT_BYTES:-262144}
      HTTP_CORS_ORIGINS: ${HTTP_CORS_ORIGINS:?HTTP_CORS_ORIGINS is required}
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-15000}
      HTTP_TRUST_PROXY_ADDRESSES: ${HTTP_TRUST_PROXY_ADDRESSES:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      PROTOCOL_ARTIFACT_CLASSIFICATION: ${PROTOCOL_ARTIFACT_CLASSIFICATION:-devnet}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://localhost:3000}
      RELEASE_MANIFEST_DIGEST: ${RELEASE_MANIFEST_DIGEST:-unreleased}
      TZ: UTC
      VALKEY_COMMAND_TIMEOUT_MS: ${VALKEY_COMMAND_TIMEOUT_MS:-1000}
      VALKEY_CONNECT_TIMEOUT_MS: ${VALKEY_CONNECT_TIMEOUT_MS:-1000}
      VALKEY_DB: ${VALKEY_DB:-0}
      VALKEY_HOST: valkey
      VALKEY_MAX_RECONNECT_ATTEMPTS: ${VALKEY_MAX_RECONNECT_ATTEMPTS:-3}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      VALKEY_PORT: '6379'
      VALKEY_USERNAME: ${VALKEY_USERNAME:-}
      VERIFICATION_ARTIFACT_DIRECTORY: /app/.artifacts/verification-packages
      VERIFICATION_ARTIFACT_STORAGE_PROFILE: ${VERIFICATION_ARTIFACT_STORAGE_PROFILE:-ephemeral}
      VALKEY_TRANSPORT_POLICY: ${VALKEY_TRANSPORT_POLICY:-platform-private}
      VOTE_MAXIMUM_CONCURRENT_PROOFS: ${VOTE_MAXIMUM_CONCURRENT_PROOFS:-2}
      VOTE_RATE_LIMIT_MAXIMUM: ${VOTE_RATE_LIMIT_MAXIMUM:-30}
      VOTE_RATE_LIMIT_WINDOW_SECONDS: ${VOTE_RATE_LIMIT_WINDOW_SECONDS:-60}
      VOTACIONES_ENV: ${VOTACIONES_ENV:?VOTACIONES_ENV is required}
      VOTACIONES_ENV_FILE: /app/config/.env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      - internal
    read_only: true
    cap_drop:
      - ALL
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ${VOTACIONES_ENV_FILE:-../devnet/.env.example}:/app/config/.env:ro
      - verification-artifacts:/app/.artifacts

  artifact-init:
    image: ${API_IMAGE:-${COMPOSE_PROJECT_NAME:-votaciones}-api}
    command:
      - sh
      - -ceu
      - chown -R 1000:1000 /app/.artifacts && chmod 0750 /app/.artifacts
    user: '0:0'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    profiles:
      - jobs
    read_only: true
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    volumes:
      - verification-artifacts:/app/.artifacts

  admin-web:
    image: ${ADMIN_WEB_IMAGE:-${COMPOSE_PROJECT_NAME:-votaciones}-admin-web}
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
    environment:
      API_ORIGIN: ${FRONTEND_API_ORIGIN:-http://localhost:3000}
      PORT: '3001'
    expose:
      - '3001'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  voter-web:
    image: ${VOTER_WEB_IMAGE:-${COMPOSE_PROJECT_NAME:-votaciones}-voter-web}
    build:
      context: ../..
      dockerfile: apps/voter-web/Dockerfile
    environment:
      API_ORIGIN: ${FRONTEND_API_ORIGIN:-http://localhost:3000}
      PORT: '3002'
    expose:
      - '3002'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17.11-alpine3.23@sha256:9ae4e8f8d0284836a505f0b2e825144e32e20499856e7dc5f7b99e19d10eedd6
    environment:
      PGDATA: /var/lib/postgresql/data
      PGTZ: UTC
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      TZ: UTC
    expose:
      - '5432'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8.1.10-alpine3.24@sha256:b21fd94099dcd4bc6b2b9230daef69b6558b887ad4a2a1afe56ff6e745a88cdb
    command:
      - valkey-server
      - --appendonly
      - 'no'
      - --save
      - ''
      - --loglevel
      - notice
    expose:
      - '6379'
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    name: ${COMPOSE_PROJECT_NAME:-votaciones}_internal
    internal: true

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-votaciones}_postgres_data
  verification-artifacts:
    name: ${COMPOSE_PROJECT_NAME:-votaciones}_verification_artifacts
