name: ${COMPOSE_PROJECT_NAME:-votaciones}

services:
  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
    environment:
      API_ORIGIN: ${FRONTEND_API_ORIGIN:-http://localhost:3000}
      PORT: '3001'
    expose:
      - '3001'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  voter-web:
    build:
      context: ../..
      dockerfile: apps/voter-web/Dockerfile
    environment:
      API_ORIGIN: ${FRONTEND_API_ORIGIN:-http://localhost:3000}
      PORT: '3002'
    expose:
      - '3002'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17.11-alpine3.23@sha256:9ae4e8f8d0284836a505f0b2e825144e32e20499856e7dc5f7b99e19d10eedd6
    environment:
      PGDATA: /var/lib/postgresql/data
      PGTZ: UTC
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      TZ: UTC
    expose:
      - '5432'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8.1.10-alpine3.24@sha256:b21fd94099dcd4bc6b2b9230daef69b6558b887ad4a2a1afe56ff6e745a88cdb
    command:
      - valkey-server
      - --appendonly
      - 'no'
      - --save
      - ''
      - --loglevel
      - notice
    expose:
      - '6379'
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    name: ${COMPOSE_PROJECT_NAME:-votaciones}_internal
    internal: true

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-votaciones}_postgres_data
