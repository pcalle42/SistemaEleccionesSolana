name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  postgres:
    image: postgres:17.11-alpine3.23@sha256:9ae4e8f8d0284836a505f0b2e825144e32e20499856e7dc5f7b99e19d10eedd6
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      TZ: UTC
    healthcheck:
      test: [CMD-SHELL, 'pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [restore-internal]
    read_only: true
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /var/run/postgresql:size=16m,mode=0770
      - /tmp:size=64m,mode=1777
      - /var/lib/postgresql/data:size=1g,mode=0700
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d:ro

networks:
  restore-internal:
    internal: true
    name: ${COMPOSE_PROJECT_NAME}_internal
