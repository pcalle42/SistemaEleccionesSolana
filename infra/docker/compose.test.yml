name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  postgres:
    image: postgres:17.11-alpine3.23@sha256:9ae4e8f8d0284836a505f0b2e825144e32e20499856e7dc5f7b99e19d10eedd6
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      TZ: UTC
    healthcheck:
      test: [CMD-SHELL, 'pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test-internal, test-access]
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT is required}:5432
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/lib/postgresql/data:size=512m,mode=0700
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d:ro

  valkey:
    image: valkey/valkey:8.1.10-alpine3.24@sha256:b21fd94099dcd4bc6b2b9230daef69b6558b887ad4a2a1afe56ff6e745a88cdb
    command: [valkey-server, --appendonly, 'no', --save, '', --loglevel, notice]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test-internal, test-access]
    ports:
      - 127.0.0.1:${VALKEY_HOST_PORT:?VALKEY_HOST_PORT is required}:6379
    security_opt: [no-new-privileges:true]

networks:
  test-internal:
    internal: true
    name: ${COMPOSE_PROJECT_NAME}_internal
  test-access:
    name: ${COMPOSE_PROJECT_NAME}_access
